name: refresh-data

# Regenerates data/processed so committed outputs always match the code.
# Runs on GitHub's servers, which can reach Yahoo Finance.
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/refresh-data.yml"

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Run pipeline
        run: python main.py
      - name: Upload full outputs for review
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            data/processed/
            outputs/figures/
      - name: Commit processed data
        run: |
          git add data/processed
          if git diff --cached --quiet; then
            echo "Processed data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh processed data"
          git push
